<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iron Notes</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>

  <header>
    <h1>سجل التمارين</h1>
  </header>

  <div class="add-form">
    <input type="text"   id="input-name" placeholder="اسم التمرين" />
    <input type="number" id="input-sets" placeholder="المجموعات" min="0" />
    <input type="number" id="input-reps" placeholder="التكرارات" min="0" />
    <button class="btn btn-add" onclick="addExercise()">إضافة</button>
  </div>
  
  <small class="notification" id="notification"></small>

  <div class="table-wrapper" id="table-wrapper">
    <p class="empty">لا توجد تمارين حتى الآن — أضف تمريناً من الأعلى.</p>
  </div>

  <div class="actions" id="action-btns" style="display:none;">
    <button class="btn btn-ghost" onclick="clearInfo()">حذف المعلومات</button>
    <button class="btn btn-danger" onclick="deleteTable()">حذف الجدول</button>
  </div>

  <script src="scripts/script.js"></script>
</body>
</html>
